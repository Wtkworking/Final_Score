<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตรวจคะแนนสอบ Final</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mali:wght@600&display=swap">
<style>
:root{
  --bg:#E9F0EC; --surface:#FFFFFF; --ink:#1B2A31; --muted:#5C6F76; --line:#BFCDC6; --pen:#C4122F; --focus:#1F6F8B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#10181B; --surface:#1A2529; --ink:#E7EEEA; --muted:#93A6AC; --line:#34454B; --pen:#FF6F82; --focus:#6CC4DE; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#10181B; --surface:#1A2529; --ink:#E7EEEA; --muted:#93A6AC; --line:#34454B; --pen:#FF6F82; --focus:#6CC4DE; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Thai","Sarabun","Leelawadee UI","Thonburi",system-ui,sans-serif;
  font-size:1rem;line-height:1.6;}
main{max-width:30rem;margin:0 auto;padding:clamp(2rem,9vh,5rem) 1.25rem 3rem}
h1{font-size:1.75rem;line-height:1.25;font-weight:600;margin:0 0 .35rem}
.lead{margin:0 0 1.75rem;color:var(--muted)}
label{display:block;font-weight:500;margin-bottom:.4rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap}
input{flex:1 1 12rem;min-width:0;font:inherit;font-size:1.2rem;letter-spacing:.06em;font-variant-numeric:tabular-nums;
  padding:.7rem .9rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:.5rem}
button{font:inherit;font-weight:600;padding:.7rem 1.3rem;border:0;border-radius:.5rem;background:var(--ink);color:var(--bg);cursor:pointer}
input:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.msg{margin:1rem 0 0;color:var(--pen);min-height:1.6em}
/* ใบคะแนน: กระดาษมีเส้นบรรทัด คะแนนเขียนด้วยปากกาแดง */
.slip{margin-top:1.5rem;background:var(--surface);border:1px solid var(--line);border-radius:.25rem;
  padding:1.4rem 1.4rem 1.6rem;position:relative}
.slip[hidden]{display:none}
.slip dl{margin:0}
.slip div.f{display:flex;gap:1rem;align-items:baseline;border-bottom:1px solid var(--line);padding:.55rem 0}
.slip dt{flex:0 0 6.5rem;color:var(--muted);font-size:.9rem}
.slip dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.slip dd.id{font-variant-numeric:tabular-nums;letter-spacing:.05em}
.score{display:flex;align-items:baseline;gap:1rem;padding-top:1.1rem}
.score dt{flex:0 0 6.5rem;color:var(--muted);font-size:.9rem}
.score dd{margin:0;font-family:"Mali","IBM Plex Sans Thai",cursive;font-weight:600;color:var(--pen);
  font-size:3rem;line-height:1;transform:rotate(-4deg);transform-origin:left bottom}
.score dd small{font-size:1.5rem}
@media (prefers-reduced-motion:no-preference){
  .slip.show .score dd{animation:ink .45s ease-out both}
  @keyframes ink{from{opacity:0;transform:rotate(-4deg) scale(1.25)}to{opacity:1;transform:rotate(-4deg) scale(1)}}
}
.note{margin-top:2rem;font-size:.875rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>ตรวจคะแนนสอบ Final (เฉพาะปรนัย)</h1>
  <p class="lead">กรอกรหัสนักศึกษาของคุณเพื่อดูคะแนน</p>
  <label for="sid">รหัสนักศึกษา</label>
  <div class="row">
    <input id="sid" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="เช่น 6752100000">
    <button id="go" type="button">ดูคะแนน</button>
  </div>
  <p class="msg" id="msg" role="alert"></p>
  <section class="slip" id="slip" hidden aria-live="polite">
    <dl>
      <div class="f"><dt>รหัสนักศึกษา</dt><dd class="id" id="o-id"></dd></div>
      <div class="f"><dt>ชื่อ-สกุล</dt><dd id="o-name"></dd></div>
      <div class="score"><dt>คะแนน</dt><dd><span id="o-score"></span> <small>/ <span id="o-full"></span></small></dd></div>
    </dl>
  </section>
  <p class="note">หากไม่พบรหัสหรือข้อมูลไม่ถูกต้อง กรุณาติดต่ออาจารย์ผู้สอน</p>
</main>

const $ = id => document.getElementById(id);
const enc = new TextEncoder();
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function clean(v){
  return v.replace(/[๐-๙]/g, d => "๐๑๒๓๔๕๖๗๘๙".indexOf(d)).replace(/\D/g, "");
}
async function lookup(){
  const id = clean($("sid").value);
  $("slip").hidden = true; $("slip").classList.remove("show"); $("msg").textContent = "";
  if(!id){ $("msg").textContent = "กรุณากรอกรหัสนักศึกษาเป็นตัวเลข"; return; }
  try{
    const k = hex(await crypto.subtle.digest("SHA-256", enc.encode("lookup:" + id))).slice(0, 20);
    const rec = DATA[k];
    if(!rec){ $("msg").textContent = "ไม่พบรหัสนักศึกษา " + id + " ตรวจสอบตัวเลขแล้วลองอีกครั้ง"; return; }
    const raw = await crypto.subtle.digest("SHA-256", enc.encode("final-score:" + id));
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const buf = unb64(rec);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0,12)}, key, buf.slice(12));
    const r = JSON.parse(new TextDecoder().decode(plain));
    $("o-id").textContent = id; $("o-name").textContent = r.n;
    $("o-score").textContent = r.s; $("o-full").textContent = r.f;
    $("slip").hidden = false; void $("slip").offsetWidth; $("slip").classList.add("show");
  }catch(e){
    $("msg").textContent = "แสดงคะแนนไม่ได้ในเบราว์เซอร์นี้ ลองเปิดด้วยเบราว์เซอร์อื่น";
  }
}
$("go").addEventListener("click", lookup);
$("sid").addEventListener("keydown", e => { if(e.key === "Enter") lookup(); });
</script>
</body>
</html>
